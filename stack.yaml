# Per-layer source roots and tooling settings for this project.
#
# The UI is Thymeleaf markup (ext: html); parser-derived metrics do not apply to templates and
# come back blank by construction (never read a blank as zero).
layers:
  frontend:
    root: src/main/resources/templates
    ext: [html]
    jscpd_format: html
  backend:
    root: src/main/java
    ext: [java]
    jscpd_format: java
    handler_pattern: "Controller[^:]*::"
