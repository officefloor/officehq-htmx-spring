<!doctype html>
<!--/*
  The shell. It renders the nav bar and the page's content fragment; it reads no page list (each
  page contributes a NavEntry @Component, collected by NavRegistry) and holds no view state (what
  is open or filtered is in the URL, since every URL here is a real server route).

  A page template starts with:
      <html th:replace="~{layout :: page(~{::content})}">
  and puts its markup in <div th:fragment="content"> ... </div>.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)" lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OfficeHQ</title>
    <!--/* htmx is vendored and served from the app, not loaded from a CDN. */-->
    <script src="/vendor/htmx.min.js"></script>
  </head>
  <body>
    <div data-testid="app-root">
      <nav data-testid="app-nav">
        <a th:each="e : ${@navRegistry.entries()}"
           th:href="${e.href()}"
           th:attr="data-testid='nav-' + ${e.section()}"
           th:text="${e.label()}">Section</a>
      </nav>
      <main data-testid="app-home" th:replace="${content}">
        <p>page content</p>
      </main>
    </div>
  </body>
</html>
