<!doctype html>
<!--/*
  The whole shell. It renders the nav bar and the page's content fragment — it does NOT know what
  pages exist (each contributes a NavEntry @Component, which NavRegistry collects) and it holds no
  state (what is open or filtered is in the URL, because every URL here is a real server route).
  Nothing about a new page belongs in this file. Do not edit it.

  A page template starts with:
      <html th:replace="~{layout :: page(~{::content})}">
  and puts its markup in <div th:fragment="content"> ... </div>.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)" lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OfficeHQ</title>
    <!--/* htmx is vendored, not loaded from a CDN: the build and the gate run Landlock-confined
           with no network egress. */-->
    <script src="/vendor/htmx.min.js"></script>
  </head>
  <body>
    <div data-testid="app-root">
      <nav data-testid="app-nav">
        <a th:each="e : ${@navRegistry.entries()}"
           th:href="${e.href()}"
           th:attr="data-testid='nav-' + ${e.section()}"
           th:text="${e.label()}">Section</a>
      </nav>
      <main data-testid="app-home" th:replace="${content}">
        <p>page content</p>
      </main>
    </div>
  </body>
</html>
